[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astral-remote"
version = "0.1.0"
description = "Windows system inventory agent that publishes a read-only report to Discord."
requires-python = "==3.14.*"
dependencies = [
  "rich==15.0.0",
  "discord.py==2.7.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pyinstaller==6.15.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["astral_remote*"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["."]

[tool.astral_remote]
agent_version = "0.1.0"
python_target = "3.14"
